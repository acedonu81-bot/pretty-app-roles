<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}html,body{width:1200px;height:800px;overflow:hidden}
body{font-family:Inter,sans-serif;position:relative;background:linear-gradient(180deg,#FFFDF7,#FBF3DD);color:#1a1a1a}
.bg{position:absolute;inset:0;background:radial-gradient(520px 420px at 100% 0,rgba(212,175,55,.34),transparent 70%),radial-gradient(520px 420px at 0 100%,rgba(212,175,55,.26),transparent 70%)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:40px}
.m{display:flex;align-items:center;gap:18px;font-family:Syne;font-weight:800;font-size:54px}
.m img{width:84px;height:84px;border-radius:22px;box-shadow:8px 8px 18px rgba(150,130,90,.28),-6px -6px 14px rgba(255,255,255,.9)}
h1{font-family:Syne;font-weight:800;font-size:104px;line-height:1.06;text-transform:uppercase}
h1 span{color:#B8941E}
.f{background:#fff;border-radius:26px;padding:20px 40px;font-weight:800;font-size:44px;color:#8B6A00;box-shadow:10px 10px 22px rgba(150,130,90,.26),-8px -8px 16px rgba(255,255,255,.95)}
</style></head><body><div class="bg"></div><div class="in">
<div class="m"><img src="logo.png">XPEAK</div>
<h1>Este finde<br><span>en IFEMA</span></h1>
