<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Post Facebook hostelería</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:#FFFDF7;font-family:Inter,sans-serif;color:#1a1a1a;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(620px 520px at 105% -5%,rgba(212,175,55,.30),transparent 70%),radial-gradient(700px 560px at -10% 105%,rgba(212,175,55,.22),transparent 70%),linear-gradient(180deg,#FFFDF7,#FBF3DD)}
.wrap{position:absolute;inset:0;padding:64px 76px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:16px;font-family:Syne;font-weight:800;font-size:42px;letter-spacing:.02em}
.marca img{width:70px;height:70px;border-radius:18px;box-shadow:8px 8px 18px rgba(150,130,90,.28),-6px -6px 14px rgba(255,255,255,.9)}
h1{font-family:Syne;font-weight:800;font-size:96px;line-height:1.04;margin-top:48px;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:#B8941E}
.sub{font-size:41px;line-height:1.3;font-weight:500;margin-top:30px;max-width:900px}
.sub b{color:#8B6A00;font-weight:800}
.row{display:flex;gap:34px;margin-top:44px;flex:1;min-height:0;padding-bottom:0}
.chips{display:flex;flex-direction:column;gap:22px;width:430px;padding-top:8px}
.chip{background:#fff;border-radius:24px;padding:26px 30px;font-weight:800;font-size:36px;line-height:1.15;box-shadow:10px 10px 22px rgba(150,130,90,.26),-8px -8px 16px rgba(255,255,255,.95);display:flex;align-items:center;gap:18px}
.chip i{flex:none;width:16px;height:16px;border-radius:50%;background:#D4AF37;box-shadow:0 0 0 6px rgba(212,175,55,.22)}
.url{margin-top:auto;font-family:Syne;font-weight:800;font-size:46px;color:#8B6A00;letter-spacing:.01em}
.foto{flex:1;border-radius:34px;overflow:hidden;border:8px solid #fff;box-shadow:16px 16px 34px rgba(150,130,90,.34),-10px -10px 22px rgba(255,255,255,.95);margin-bottom:0}
.foto img{width:100%;height:100%;object-fit:cover;object-position:62% 0%;display:block;filter:contrast(1.06) saturate(1.06) brightness(1.03)}
.left{display:flex;flex-direction:column;padding-bottom:0}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="marca"><img src="logo.png">XPEAK</div>
  <h1>¿Te falta<br>personal<br><span>este finde?</span></h1>
  <p class="sub">Publica tu oferta y elige entre <b>camareros y extras</b> con sus condiciones a la vista.</p>
  <div class="row">
    <div class="left">
      <div class="chips">
        <div class="chip"><i></i>Tarifa y horarios claros</div>
        <div class="chip"><i></i>Contrato digital</div>
        <div class="chip"><i></i>Sin coste para el local</div>
      </div>
      <div class="url">xpeak.es</div>
    </div>
    <div class="foto"><img src="foto.jpg"></div>
  </div>
</div>
</body></html>
