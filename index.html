<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XPEAK — Directorio Profesional del Ocio Nocturno</title>
    <meta name="description" content="XPEAK conecta DJs, Staff, Estilistas y Empresarios del sector nocturno en España y Europa. Encuentra talento o publica ofertas en tiempo real." />
    <meta name="author" content="XPEAK" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://xpeak.site/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="XPEAK — Directorio Profesional del Ocio Nocturno" />
    <meta property="og:description" content="Conecta DJs, Staff, Estilistas y Empresarios del sector nocturno en España y Europa. Encuentra talento o publica ofertas en tiempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xpeak.site/" />
    <meta property="og:site_name" content="XPEAK" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://xpeak.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XPEAK — Directorio Profesional del Ocio Nocturno" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xpeak_site" />
    <meta name="twitter:title" content="XPEAK — Directorio Profesional del Ocio Nocturno" />
    <meta name="twitter:description" content="Conecta DJs, Staff, Estilistas y Empresarios del sector nocturno en España y Europa." />
    <meta name="twitter:image" content="https://xpeak.site/og-image.jpg" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "XPEAK",
      "url": "https://xpeak.site",
      "logo": "https://xpeak.site/favicon.png",
      "description": "Directorio profesional del ocio nocturno en España y Europa. Conecta DJs, Staff, Estilistas y Empresarios.",
      "areaServed": ["ES"],
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "XPEAK",
      "url": "https://xpeak.site",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://xpeak.site/dashboard?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect: Google Fonts (Variable Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://videos.pexels.com" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://player.twitch.tv" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.mixcloud.com" />
    <link rel="preconnect" href="https://w.soundcloud.com" />
    <link rel="preconnect" href="https://hearthis.at" />
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://open.spotify.com" />

    <!-- Analytics (Plausible — GDPR, sin cookies, sin datos personales) -->
    <script defer data-domain="xpeak.site" src="https://plausible.io/js/script.js"></script>

    <!-- GitHub Pages SPA routing: decode redirect from 404.html -->
    <script>
      (function(l){
        if(l.search[1]==='/'){
          var decoded=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');
          window.history.replaceState(null,null,l.pathname.slice(0,-1)+decoded+l.hash);
        }
      }(window.location));
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
