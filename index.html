    <!-- Preload del poster del hero: es el LCP de la portada (Landing.tsx) y
         estaba solo en el <picture> del JSX, así que el navegador no lo

    <!-- Hoja de estilos de las fuentes. Estaba como @import dentro de
         src/index.css, lo que encadenaba las descargas: la petición no salía
         hasta haber bajado y parseado el CSS del bundle (ms ~1.234 en móvil
         4G). Declarada aquí, el navegador la descubre en el HTML inicial y la
         descarga en paralelo con el resto. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
