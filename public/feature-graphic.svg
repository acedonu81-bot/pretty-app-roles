<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6B10"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6B10"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glowLeft)"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#D4AF37" stroke-width="1">
    <line x1="0" y1="125" x2="1024" y2="125"/>
    <line x1="0" y1="250" x2="1024" y2="250"/>
    <line x1="0" y1="375" x2="1024" y2="375"/>
    <line x1="170" y1="0" x2="170" y2="500"/>
    <line x1="340" y1="0" x2="340" y2="500"/>
    <line x1="510" y1="0" x2="510" y2="500"/>
    <line x1="680" y1="0" x2="680" y2="500"/>
    <line x1="850" y1="0" x2="850" y2="500"/>
  </g>

  <!-- Big X watermark right (decorative) -->
  <g opacity="0.05" filter="url(#softblur)">
    <line x1="600" y1="20" x2="1010" y2="480" stroke="#D4AF37" stroke-width="100" stroke-linecap="round"/>
    <line x1="1010" y1="20" x2="600" y2="480" stroke="#D4AF37" stroke-width="100" stroke-linecap="round"/>
  </g>

  <!-- LEFT CONTENT — all constrained to max x=540 -->

  <!-- Small X icon logo -->
  <g filter="url(#glow)">
    <line x1="68" y1="130" x2="136" y2="218" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <line x1="136" y1="130" x2="68" y2="218" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="102" cy="174" r="5" fill="#FFF0A0" opacity="0.9"/>
  </g>

  <!-- XPEAK title -->
  <text x="68" y="318"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="116"
    letter-spacing="-2"
    fill="url(#goldH)">XPEAK</text>

  <!-- Tagline — 2 lines to avoid overflow -->
  <text x="72" y="356"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="19"
    letter-spacing="3.5"
    fill="#D4AF37"
    opacity="0.6">LA PLATAFORMA PROFESIONAL</text>
  <text x="72" y="380"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="19"
    letter-spacing="3.5"
    fill="#D4AF37"
    opacity="0.6">DE EVENTOS EN ESPAÑA</text>

  <!-- Divider -->
  <rect x="72" y="398" width="300" height="1.5" rx="1" fill="url(#goldH)" opacity="0.35"/>

  <!-- Feature pills -->
  <rect x="72" y="416" width="140" height="36" rx="18" fill="#D4AF37" fill-opacity="0.07" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1"/>
  <text x="142" y="439" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="#D4AF37" text-anchor="middle">FLASH BOOKING</text>

  <rect x="224" y="416" width="112" height="36" rx="18" fill="#D4AF37" fill-opacity="0.07" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1"/>
  <text x="280" y="439" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="#D4AF37" text-anchor="middle">CONTRATOS</text>

  <rect x="348" y="416" width="112" height="36" rx="18" fill="#D4AF37" fill-opacity="0.07" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1"/>
  <text x="404" y="439" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="#D4AF37" text-anchor="middle">DIRECTORIO</text>

  <!-- RIGHT CONTENT — phone mockup starts at x=620 -->
  <rect x="640" y="50" width="240" height="400" rx="32" fill="#141414" stroke="#D4AF37" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Phone notch -->
  <rect x="710" y="62" width="60" height="8" rx="4" fill="#1a1a1a"/>

  <!-- Screen rows -->
  <!-- Header bar -->
  <rect x="658" y="90" width="204" height="22" rx="6" fill="#D4AF37" fill-opacity="0.1"/>
  <rect x="666" y="97" width="60" height="8" rx="3" fill="#D4AF37" fill-opacity="0.4"/>

  <!-- Card 1 -->
  <rect x="658" y="126" width="204" height="82" rx="10" fill="#D4AF37" fill-opacity="0.06" stroke="#D4AF37" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="670" y="140" width="90" height="9" rx="3" fill="#D4AF37" fill-opacity="0.45"/>
  <rect x="670" y="158" width="156" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="670" y="172" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="670" y="186" width="60" height="14" rx="5" fill="#D4AF37" fill-opacity="0.2"/>

  <!-- Card 2 -->
  <rect x="658" y="222" width="204" height="82" rx="10" fill="#D4AF37" fill-opacity="0.04" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="670" y="236" width="70" height="9" rx="3" fill="#D4AF37" fill-opacity="0.35"/>
  <rect x="670" y="254" width="156" height="6" rx="3" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="670" y="268" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="670" y="282" width="60" height="14" rx="5" fill="#D4AF37" fill-opacity="0.15"/>

  <!-- Card 3 -->
  <rect x="658" y="318" width="204" height="82" rx="10" fill="#D4AF37" fill-opacity="0.04" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="670" y="332" width="80" height="9" rx="3" fill="#D4AF37" fill-opacity="0.3"/>
  <rect x="670" y="350" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="670" y="364" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="670" y="378" width="60" height="14" rx="5" fill="#D4AF37" fill-opacity="0.15"/>

  <!-- xpeak.es -->
  <text x="960" y="488"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="#D4AF37"
    opacity="0.3"
    text-anchor="end">xpeak.es</text>
</svg>
